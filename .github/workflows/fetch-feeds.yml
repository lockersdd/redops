name: Fetch RSS Feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch RSS feeds
        run: python fetch_feeds.py

      - name: Commit feeds.json
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add feeds.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: feeds update"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
